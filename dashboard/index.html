<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VitalLink Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <div class="patient-card">
      <h2>Hillary</h2>
      <p>Age: 82</p>
    </div>

    <div class="activity-log">
      <h4>Activity Log</h4>
      <ul id="activityLog"></ul>
    </div>
  </aside>

  <main class="main">
    <div class="top-action-bar">
      <button id="openSearchModal" class="search-toggle-btn">🔍 Event Search</button>
      <div class="theme-icon" id="themeToggle">🌙</div>
    </div>

    <div class="top-cards">
      <div class="card">
        <h3>Heart Rate</h3>
        <div id="hrValue">-- BPM</div>
      </div>

      <div class="card normal" id="fallStatusCard">
        <h3>Fall Status</h3>
        <div class="fall-row">
          <span id="fallIcon">🟢</span>
          <span id="fallStatus">Normal Movement</span>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Status History</h3>
      <canvas id="historyChart"></canvas>
    </div>
  </main>
</div>

<!-- FALL MODAL -->
<div id="fallModal" class="modal hidden">
  <div class="modal-content">
    <h1>⚠ FALL DETECTED</h1>
    <button onclick="acknowledgeFall()">Acknowledge</button>
  </div>
</div>

<!-- SEARCH MODAL -->
<div id="searchModal" class="modal-overlay hidden">
  <div class="search-modal">

    <div id="searchLoading" class="search-loading hidden">
      <div class="spinner"></div>
      <p>Fetching data…</p>
    </div>

    <header class="search-modal-header">
      <h3>Search Events</h3>
      <button id="closeSearchModal">✕</button>
    </header>

    <div class="checkbox-group">
      <label><input type="checkbox" class="eventType" value="HeartRate" checked> Heart Rate</label>
      <label><input type="checkbox" class="eventType" value="Fall" checked> Fall</label>
    </div>

    <div class="filter-row">
      <input type="datetime-local" id="startTime">
      <input type="datetime-local" id="endTime">
    </div>

    <button id="applyFilter" class="primary-btn">Apply</button>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
          <th>Value</th>
          <th>Height</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
